spring:
  application:
    name: umc-study

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:umcine;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  h2:
    console:
      enabled: true

jwt:
  secret: ${JWT_SECRET:umc-11th-movie-rating-secret-key-for-local-development}
  access-expiration: ${JWT_ACCESS_EXPIRATION:3600}
